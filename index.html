  }

  /* 控制条 */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 8px 12px;
    font-size: 14px;
  }
  .controls label { color: #666; }
  .controls select, .controls button.ctl {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 12px;
    border: 2px solid #ffd6a5;
    background: #fff;
    color: #444;
    cursor: pointer;
  }
  .controls button.ctl.on { background: #ffb347; color: #fff; border-color: #ffb347; }

  /* 单元标签 */
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 10px 16px;
    border-radius: 20px;
    border: none;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    font-size: 16px;
    cursor: pointer;
    color: #555;
    transition: transform .15s;
  }
  .tab:active { transform: scale(.95); }
  .tab.active {
    background: #ff7b54;
    color: #fff;
    box-shadow: 0 4px 10px rgba(255,123,84,.4);
  }

  main { max-width: 900px; margin: 0 auto; padding: 6px 16px 60px; }
  .section-title {
    font-size: 18px;
    color: #4a90d9;
    margin: 18px 4px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 12px;
  }
  .grid.sentences { grid-template-columns: 1fr; }
  @media (min-width: 640px) {
    .grid.sentences { grid-template-columns: 1fr 1fr; }
  }

  .card {
    position: relative;
    background: #fff;
    border-radius: 18px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,.08);
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform .12s, border-color .12s;
    user-select: none;
  }
  .card .star {
    display: none;
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 18px;
  }
  .card.recorded .star { display: block; }
  .recbar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }
  .recbar button {
    border: none;
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 14px;
    background: #eef3f9;
    color: #456;
    cursor: pointer;
  }
  .recbar button:active { transform: scale(.94); }
  .recbar .recbtn.recording {
    background: #ff5252;
    color: #fff;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .6; }
  }
  .card.sentence { flex-wrap: wrap; }
  .card.sentence .recbar { width: 100%; justify-content: flex-start; margin-top: 8px; }
  .card:active { transform: scale(.94); }
  .card.playing {
    border-color: #ffb347;
    background: #fff8ec;
    animation: bounce .5s;
  }
  @keyframes bounce {
    0%,100% { transform: scale(1); }
    40% { transform: scale(1.06); }
  }
  .card .emoji { font-size: 54px; line-height: 1.2; }
  .card .en {
    font-size: 30px;
    font-weight: 700;
    color: #2c6fb7;
    margin-top: 8px;
    font-family: "Comic Sans MS", "Chalkboard SE", "PingFang SC", sans-serif;
  }
  .card .zh { font-size: 17px; color: #999; margin-top: 5px; }

  .card.sentence { text-align: left; display: flex; align-items: center; gap: 12px; }
  .card.sentence .emoji { font-size: 44px; flex: 0 0 auto; }
  .card.sentence .en { font-size: 25px; margin-top: 0; line-height: 1.3; }
  .card.sentence .zh { font-size: 16px; margin-top: 4px; }

  .tip {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    padding: 20px 12px;
  }
  #noVoiceWarn {
    display: none;
    background: #fff3cd;
    color: #856404;
    border-radius: 12px;
    padding: 10px 14px;
    margin: 10px auto;
    max-width: 600px;
    font-size: 14px;
    text-align: center;
  }
</style>

<header>

</header>

<div class="controls">
  <label>语速：
    <select id="rate">
      <option value="0.7">🐢 很慢</option>
      <option value="0.85">🚶 慢速</option>
      <option value="1" selected>🏃 正常</option>
      <option value="1.15">🚀 快</option>
    </select>
  </label>
  <button class="ctl" id="repeatBtn" title="每次朗读两遍">读两遍：关</button>
  <label>发音：
    <select id="modeSel">
      <option value="fish" selected>🐟 Sarah（Fish 真人感）</option>
      <option value="ava">👩 Ava（自然有感情）</option>
      <option value="jenny">👩 Jenny（清晰标准）</option>
      <option value="ana">👧 Ana（小朋友）</option>
      <option value="sys">🤖 本机语音</option>
    </select>
  </label>
  <label id="voiceLabel" style="display:none">发音人：
    <select id="voiceSel"></select>
  </label>
</div>

<div id="noVoiceWarn">⚠️ 当前浏览器没有找到英语语音，请换用 Safari 或 Chrome 浏览器试试。</div>

<div id="cacheStat" style="text-align:center;font-size:12px;color:#a9b3bf;padding:2px 12px 0;"></div>

<div class="tabs" id="tabs"></div>

<main id="content"></main>

<div class="tip">💡 建议家长陪同：孩子点卡片听一遍，再大声跟读一遍，每天 10 分钟。</div>

const synth = window.speechSynthesis;
let enVoices = [];
let currentUnit = 0;
let repeatTwice = false;

const voiceSel = document.getElementById("voiceSel");
const rateSel = document.getElementById("rate");
const repeatBtn = document.getElementById("repeatBtn");
const modeSel = document.getElementById("modeSel");
const voiceLabel = document.getElementById("voiceLabel");

modeSel.addEventListener("change", () => {
  voiceLabel.style.display = modeSel.value === "sys" ? "" : "none";
  prefetchUnit(currentUnit);
  setTimeout(prefetchAll, 1500);
});

// 与 gen_audio.py 中的 slug() 保持一致
function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

function audioUrl(text) {
  return "audio/" + modeSel.value + "/" + slug(text) + ".mp3";
}

// 预加载：提前把 mp3 下载成 blob，点击时零等待
const readyUrls = new Map();   // 网络地址 -> 本地 blob 地址
const loadingUrls = new Set();
function prefetch(url) {
  if (readyUrls.has(url) || loadingUrls.has(url)) return;
  loadingUrls.add(url);
  fetch(url)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(b => readyUrls.set(url, URL.createObjectURL(b)))
    .catch(() => {})
    .finally(() => loadingUrls.delete(url));
}
function prefetchUnit(i) {
  if (modeSel.value === "sys") return;
  const u = UNITS[i];
  u.words.concat(u.sentences).forEach(item => prefetch(audioUrl(item.en)));
}
function prefetchAll() {
  if (modeSel.value === "sys") return;
  UNITS.forEach((u, i) => prefetchUnit(i));
}

// 后台把四套音色全部拉一遍：每个请求经过 Service Worker 写入本机缓存，
// 拉完即可完全离线；已缓存的请求秒回，不重复下载
async function warmAllVoices() {
  const urls = [];
  ["fish", "ava", "jenny", "ana"].forEach(m =>
    UNITS.forEach(u => u.words.concat(u.sentences).forEach(it =>
      urls.push("audio/" + m + "/" + slug(it.en) + ".mp3"))));
  const stat = document.getElementById("cacheStat");
  let i = 0, ok = 0, fail = 0, dl = 0;
  // 音频放进独立缓存区（不带版本号），页面版本更新时不会被清掉
  let cache = null;
  try { if ("caches" in window) cache = await caches.open("kouyu-audio"); } catch (e) {}
  const upd = () => {
    const done = ok + fail;
    if (done < urls.length) {
      stat.textContent = "🔍 检查音频 " + done + " / " + urls.length + (dl ? "（已下载 " + dl + " 条）" : "");
    } else if (fail > 0) {
      stat.textContent = "⚠️ 还有 " + fail + " 条音频未缓存成功，下次联网打开会自动重试";
    } else if (dl > 0) {
      stat.textContent = "✅ 全部 " + urls.length + " 条音频已缓存（本次新增 " + dl + " 条），可离线使用";
    } else {
      stat.textContent = "✅ 全部 " + urls.length + " 条音频已在本机，可离线使用";
    }
  };
  upd();
  async function worker() {
    while (i < urls.length) {
      const url = urls[i++];
      try {
        // 本机已有 → 毫秒级跳过，不发网络请求
        if ((cache && await cache.match(url)) || ("caches" in window && await caches.match(url))) {
          ok++; upd(); continue;
        }
      } catch (e) {}
      try {
        const r = await fetch(url);
        if (r.ok) { if (cache) await cache.put(url, r.clone()); await r.blob(); ok++; dl++; }
        else fail++;
      } catch (e) { fail++; }
      upd();
      await new Promise(res => setTimeout(res, 20));
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
}

let player = null;
function stopAll() {
  if (player) { player.pause(); player = null; }
  if (synth) synth.cancel();
  document.querySelectorAll(".card.playing").forEach(c => c.classList.remove("playing"));
}

// 优先播放预生成的真人 mp3，失败（文件缺失/未上传）时退回本机语音
function playAudio(text, card) {
  stopAll();
  const url = audioUrl(text);
  const a = new Audio(readyUrls.get(url) || url);
  a.playbackRate = Number(rateSel.value);
  if ("preservesPitch" in a) a.preservesPitch = true;
  player = a;
  if (card) card.classList.add("playing");
  let played = 0;
  a.onended = () => {
    played++;
    if (repeatTwice && played < 2) {
      setTimeout(() => { if (player === a) { a.currentTime = 0; a.play(); } }, 400);
    } else {
      if (card) card.classList.remove("playing");
      if (player === a) player = null;
    }
  };
  a.onerror = () => { if (player === a) { player = null; speakTTS(text, card); } };
  a.play().catch(() => { if (player === a) { player = null; speakTTS(text, card); } });
}

// macOS 自带的特效/卡通音色（羊叫、弹簧、唱歌、机器人等），不适合学习，全部过滤掉
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|junior|kathy|ralph|fred|grandma|grandpa|rocko|shelley|eddy|flo|reed|sandy/i;
// 公认清晰自然的音色，排在最前面
const PREFERRED = /samantha|google us english|ava|allison|alex|zoe|nicky|joelle|karen|daniel|serena|moira|tessa|microsoft/i;

function loadVoices() {
  const all = synth ? synth.getVoices() : [];
  let list = all.filter(v => v.lang.toLowerCase().startsWith("en") && !NOVELTY.test(v.name));
  if (list.length === 0) list = all.filter(v => v.lang.toLowerCase().startsWith("en"));
  enVoices = list;
  // 优先级：Google US English > 知名好音色 > 美音 > 英音 > 其他英语
  enVoices.sort((a, b) => {
    const score = v => (/google us english/i.test(v.name) ? 8 : 0) +
      (PREFERRED.test(v.name) ? 4 : 0) +
      (/en[-_]US/i.test(v.lang) ? 2 : /en[-_]GB/i.test(v.lang) ? 1 : 0);
    return score(b) - score(a);
  });
  const prevName = voiceSel.selectedOptions[0] ? voiceSel.selectedOptions[0].textContent : "";
  voiceSel.innerHTML = "";
  enVoices.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = v.name + " (" + v.lang + ")";
    if (opt.textContent === prevName) opt.selected = true;
    voiceSel.appendChild(opt);
  });
  document.getElementById("noVoiceWarn").style.display =
    (!synth || enVoices.length === 0) ? "block" : "none";
}
loadVoices();
if (synth && synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = loadVoices;
}

function speakTTS(text, card) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  const v = enVoices[Number(voiceSel.value) || 0];
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = Number(rateSel.value);
  u.pitch = 1.05;

  document.querySelectorAll(".card.playing").forEach(c => c.classList.remove("playing"));
  if (card) card.classList.add("playing");

  u.onend = () => {
    if (repeatTwice) {
      const u2 = new SpeechSynthesisUtterance(text);
      u2.voice = u.voice; u2.lang = u.lang; u2.rate = u.rate; u2.pitch = u.pitch;
      u2.onend = () => { if (card) card.classList.remove("playing"); };
      setTimeout(() => synth.speak(u2), 400);
    } else {
      if (card) card.classList.remove("playing");
    }
  };
  synth.speak(u);
}

repeatBtn.addEventListener("click", () => {
  repeatTwice = !repeatTwice;
  repeatBtn.textContent = "读两遍：" + (repeatTwice ? "开" : "关");
  repeatBtn.classList.toggle("on", repeatTwice);
});

// ---------- 录音打卡：孩子读一遍存在手机本地（IndexedDB），可回放、可重录 ----------
let recDb = null;
const recDone = new Set();   // 已有录音的 slug
const dbReq = indexedDB.open("kouyu-rec", 1);
dbReq.onupgradeneeded = e => e.target.result.createObjectStore("recs");
dbReq.onsuccess = e => {
  recDb = e.target.result;
  const q = recDb.transaction("recs").objectStore("recs").getAllKeys();
  q.onsuccess = () => { q.result.forEach(k => recDone.add(k)); renderUnit(); };
};
function saveRec(s, blob) {
  if (!recDb) return;
  recDb.transaction("recs", "readwrite").objectStore("recs").put(blob, s);
  recDone.add(s);
}
function getRec(s) {
  return new Promise(res => {
    if (!recDb) return res(null);
    const q = recDb.transaction("recs").objectStore("recs").get(s);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => res(null);
  });
}

let recorder = null, recTimer = null;
async function toggleRec(item, card, btn) {
  if (recorder) { recorder.stop(); return; }   // 再点一下 = 停止
  stopAll();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert("无法使用麦克风。请在弹窗或系统设置里允许本页面使用麦克风；如果是主屏幕图标打开的，也可以试试用 Safari 打开。");
    return;
  }
  const mime = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4"
    : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    clearTimeout(recTimer);
    recorder = null;
    btn.classList.remove("recording");
    const blob = new Blob(chunks, { type: mime || "audio/webm" });
    if (blob.size > 500) {
      saveRec(slug(item.en), blob);
      card.classList.add("recorded");
      const pb = card.querySelector(".playrec");
      if (pb) pb.style.display = "";
      btn.textContent = "🎤 重录";
    } else {
      btn.textContent = recDone.has(slug(item.en)) ? "🎤 重录" : "🎤 录音";
    }
  };
  recorder = mr;
  btn.classList.add("recording");
  btn.textContent = "⏹ 停止";
  mr.start();
  recTimer = setTimeout(() => { if (recorder === mr) mr.stop(); }, 15000);  // 最长 15 秒
}

async function playRec(item, card) {
  stopAll();
  const blob = await getRec(slug(item.en));
  if (!blob) return;
  const a = new Audio(URL.createObjectURL(blob));
  player = a;
  if (card) card.classList.add("playing");
  a.onended = () => {
    if (card) card.classList.remove("playing");
    URL.revokeObjectURL(a.src);
    if (player === a) player = null;
  };
  a.play().catch(() => {});
}

function makeCard(item, isSentence) {
  const card = document.createElement("div");
  card.className = "card" + (isSentence ? " sentence" : "");
  if (isSentence) {
    card.innerHTML =
      '<div class="emoji">' + item.emoji + '</div>' +
      '<div><div class="en">' + item.en + '</div>' +
      '<div class="zh">' + item.zh + '</div></div>';
  } else {
    card.innerHTML =
      '<div class="emoji">' + item.emoji + '</div>' +
      '<div class="en">' + item.en + '</div>' +
      '<div class="zh">' + item.zh + '</div>';
  }
  card.addEventListener("click", () => {
    if (modeSel.value === "sys") speakTTS(item.en, card);
    else playAudio(item.en, card);
  });

  const s = slug(item.en);
  const has = recDone.has(s);
  if (has) card.classList.add("recorded");
  const star = document.createElement("span");
  star.className = "star";
  star.textContent = "⭐";
  card.appendChild(star);
  const bar = document.createElement("div");
  bar.className = "recbar";
  bar.innerHTML =
    '<button class="recbtn">' + (has ? "🎤 重录" : "🎤 录音") + '</button>' +
    '<button class="playrec"' + (has ? "" : ' style="display:none"') + '>▶️ 我读的</button>';
  bar.addEventListener("click", e => e.stopPropagation());
  bar.querySelector(".recbtn").addEventListener("click", () => toggleRec(item, card, bar.querySelector(".recbtn")));
  bar.querySelector(".playrec").addEventListener("click", () => playRec(item, card));
  card.appendChild(bar);
  return card;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  UNITS.forEach((u, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === currentUnit ? " active" : "");
    b.textContent = u.name;
    b.addEventListener("click", () => {
      currentUnit = i;
      renderTabs();
      renderUnit();
    });
    tabs.appendChild(b);
  });
}

function renderUnit() {
  stopAll();
  const main = document.getElementById("content");
  main.innerHTML = "";
  const unit = UNITS[currentUnit];

  const t1 = document.createElement("div");
  t1.className = "section-title";
  t1.textContent = "📚 单词和短语";
  main.appendChild(t1);
  const g1 = document.createElement("div");
  g1.className = "grid";
  unit.words.forEach(w => g1.appendChild(makeCard(w, false)));
  main.appendChild(g1);

  const t2 = document.createElement("div");
  t2.className = "section-title";
  t2.textContent = "💬 句子";
  main.appendChild(t2);
  const g2 = document.createElement("div");
  g2.className = "grid sentences";
  unit.sentences.forEach(s => g2.appendChild(makeCard(s, true)));
  main.appendChild(g2);

  prefetchUnit(currentUnit);
}

renderTabs();
renderUnit();
setTimeout(prefetchAll, 2000);
setTimeout(warmAllVoices, 4000);

// PWA：注册 Service Worker，把整站缓存到本机，离线可用、点击零延迟
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js");
}
